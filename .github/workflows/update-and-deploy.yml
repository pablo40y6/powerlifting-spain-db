name: Update data and deploy static site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-and-deploy.yml'
      - 'scraper/**'
      - 'scripts/audit-index.js'
      - 'web/**'
  schedule:
    - cron: '17 4 * * MON'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLS_INTERNATIONAL_DIR: ${{ github.workspace }}/.cache/international
      PLS_HISTORY_DIR: ${{ github.workspace }}/.cache/history
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Restore international results cache
        uses: actions/cache@v4
        with:
          path: .cache/international
          key: international-results-${{ github.run_id }}
          restore-keys: international-results-

      - name: Restore historical results cache
        uses: actions/cache@v4
        with:
          path: .cache/history
          key: historical-results-${{ github.run_id }}
          restore-keys: historical-results-

      - name: Build data index
        run: npm run build:index

      - name: Audit data before publishing
        run: npm run audit:index -- --strict

      - name: Build static site
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
